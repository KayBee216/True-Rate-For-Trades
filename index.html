<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TrueRate</title>
<style>
/* ============================================================
   TRUERATE DESIGN TOKENS
   Blueprint blue on shop-floor gray. Safety orange is reserved
   for warnings only. Green is reserved for healthy.
   ============================================================ */
:root {
  --ink: #16222E;
  --ink-soft: #51616F;
  --blueprint: #1B4F8A;
  --blueprint-deep: #143C6B;
  --paper: #FFFFFF;
  --floor: #EFF2F1;
  --line: #D8DEDC;
  --safety: #C75300;
  --safety-bg: #FCEFE4;
  --healthy: #1F6B43;
  --healthy-bg: #E8F3EC;
  --ticket-edge: #C9D2D0;
  --radius: 14px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  background: var(--floor);
  color: var(--ink);
  font-size: 17px;
  line-height: 1.45;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }

header {
  background: var(--ink);
  color: #fff;
  padding: 18px 20px 16px;
}
.wordmark { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
.wordmark span { color: #7FB3E8; }
.tagline { font-size: 13px; color: #AEBDC9; margin-top: 2px; }

nav.tabs {
  display: flex;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
}
nav.tabs button {
  flex: 1;
  background: none;
  border: none;
  padding: 15px 8px 13px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-soft);
  border-bottom: 3px solid transparent;
}
nav.tabs button.active { color: var(--blueprint); border-bottom-color: var(--blueprint); }
nav.tabs button:focus-visible,
.btn:focus-visible, .pick:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #7FB3E8;
  outline-offset: 2px;
}

main { max-width: 520px; margin: 0 auto; padding: 20px 16px 110px; }
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 20px;
  margin-bottom: 16px;
}
h1 { font-size: 24px; font-weight: 800; line-height: 1.2; margin-bottom: 10px; }
h2 { font-size: 20px; font-weight: 700; line-height: 1.25; margin-bottom: 8px; }
p.help { color: var(--ink-soft); font-size: 15px; margin-bottom: 6px; }
p + p { margin-top: 8px; }

.progress { display: flex; gap: 5px; margin-bottom: 18px; }
.progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.progress i.done { background: var(--blueprint); }
.step-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 6px;
}
.input-wrap { position: relative; margin: 18px 0 6px; }
.input-wrap .prefix, .input-wrap .suffix {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink-soft);
  pointer-events: none;
}
.input-wrap .prefix { left: 16px; }
.input-wrap .suffix { right: 16px; }
input.big {
  width: 100%;
  font-size: 28px;
  font-weight: 700;
  font-family: var(--mono);
  padding: 14px 16px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #FBFCFC;
  color: var(--ink);
  -moz-appearance: textfield;
}
input.big::-webkit-outer-spin-button,
input.big::-webkit-inner-spin-button { -webkit-appearance: none; }
input.big.has-prefix { padding-left: 42px; }
input.big.has-suffix { padding-right: 48px; }
input.big:focus { border-color: var(--blueprint); }
.field-error {
  color: var(--safety);
  font-size: 14px;
  font-weight: 600;
  min-height: 20px;
  margin-top: 6px;
}

.btn {
  display: block;
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 17px;
  font-weight: 700;
  text-align: center;
}
.btn-primary { background: var(--blueprint); color: #fff; }
.btn-primary:active { background: var(--blueprint-deep); }
.btn-ghost {
  background: none;
  color: var(--blueprint);
  border: 2px solid var(--line);
  margin-top: 10px;
}
.btn-row { margin-top: 20px; }

/* margin picker cards */
.pick {
  display: block;
  width: 100%;
  text-align: left;
  background: #FBFCFC;
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 15px 16px;
  margin-top: 10px;
}
.pick:active { border-color: var(--blueprint); }
.pick .pick-title { font-size: 17px; font-weight: 700; }
.pick .pick-title em { font-style: normal; color: var(--blueprint); }
.pick .pick-sub { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
.pick.recommended { border-color: var(--blueprint); }
.pick .badge {
  float: right;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--blueprint);
  background: #E5EEF8;
  border-radius: 20px;
  padding: 3px 9px;
  margin-top: 2px;
}

.ticket {
  background: var(--paper);
  border: 1px solid var(--ticket-edge);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
}
.ticket-head {
  background: var(--ink);
  color: #fff;
  padding: 12px 20px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
}
.ticket-head .stamp { color: #7FB3E8; }
.ticket-body { padding: 20px; }
.ticket-perf { border-top: 2px dashed var(--ticket-edge); margin: 16px -20px; }
.rate-line { margin-bottom: 4px; }
.rate-label {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.rate-value {
  font-family: var(--mono);
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1.1;
}
.rate-value small { font-size: 17px; font-weight: 600; color: var(--ink-soft); letter-spacing: 0; }
.breakdown { width: 100%; border-collapse: collapse; font-size: 15px; }
.breakdown td { padding: 7px 0; border-bottom: 1px solid var(--floor); }
.breakdown td:last-child { text-align: right; font-family: var(--mono); font-weight: 600; }
.breakdown tr.total td { border-bottom: none; font-weight: 700; padding-top: 12px; }

.status { border-radius: 12px; padding: 16px; font-size: 15px; margin-top: 16px; }
.status strong { display: block; margin-bottom: 6px; font-size: 16px; }
.status.warn { background: var(--safety-bg); color: #7A3300; border: 1px solid #EAC4A4; }
.status.warn strong { color: var(--safety); }
.status.good { background: var(--healthy-bg); color: #14492E; border: 1px solid #BCDCC8; }
.status.good strong { color: var(--healthy); }
.note {
  font-size: 14px;
  color: var(--ink-soft);
  background: var(--floor);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 14px;
}

.field { margin-bottom: 18px; }
.field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 7px; }
select.big {
  width: 100%;
  font-size: 18px;
  font-weight: 600;
  padding: 14px 16px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #FBFCFC;
  color: var(--ink);
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%2351616F' stroke-width='2' fill='none'/></svg>");
  background-repeat: no-repeat;
  background-position: right 16px center;
}
.seg {
  display: flex;
  background: var(--floor);
  border-radius: 12px;
  padding: 4px;
  gap: 4px;
  margin-bottom: 18px;
}
.seg button {
  flex: 1;
  border: none;
  background: none;
  padding: 10px 6px;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-soft);
  border-radius: 9px;
  line-height: 1.2;
}
.seg button.active { background: var(--paper); color: var(--blueprint); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.welcome-lead { font-size: 16px; color: var(--ink-soft); margin-bottom: 4px; }
.choice {
  display: block;
  width: 100%;
  text-align: left;
  background: #FBFCFC;
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 16px 17px;
  margin-top: 12px;
}
.choice:active { border-color: var(--blueprint); }
.choice .c-title { font-size: 17px; font-weight: 700; color: var(--ink); }
.choice .c-sub { font-size: 14px; color: var(--ink-soft); margin-top: 3px; line-height: 1.4; }
.choice .badge {
  float: right;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--blueprint);
  background: #E5EEF8;
  border-radius: 20px;
  padding: 3px 9px;
  margin-top: 1px;
}
.choice.lead-choice { border-color: var(--blueprint); }
.lead-note {
  font-size: 14px;
  color: var(--ink-soft);
  margin: -6px 0 14px;
}
.quote-box {
  font-size: 15px;
  background: var(--floor);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  margin-top: 14px;
  white-space: pre-wrap;
}
.locked { text-align: center; padding: 36px 20px; }
.locked .icon { font-size: 34px; margin-bottom: 10px; }
.compare {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #FBFCFC;
  overflow: hidden;
}
.compare summary {
  list-style: none;
  cursor: pointer;
  padding: 13px 15px;
  font-size: 15px;
  font-weight: 700;
  color: var(--blueprint);
}
.compare summary::-webkit-details-marker { display: none; }
.compare[open] summary { border-bottom: 1px solid var(--line); }
.compare-body { padding: 14px 15px 16px; }
.compare-body .breakdown td { font-size: 14px; }
.compare-body .breakdown td:last-child { font-family: inherit; font-weight: 600; color: var(--ink); }
.bottomnav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  background: var(--paper);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 20;
}
.bottomnav button {
  flex: 1;
  background: none;
  border: none;
  padding: 9px 6px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
}
.bottomnav button .ic { font-size: 20px; line-height: 1; }
.bottomnav button.active { color: var(--blueprint); }
main { padding-bottom: 96px; }

/* customer experience guide */
.guide { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.guide .q {
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  background: #FBFCFC;
}
.guide .q .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--blueprint); color: #fff; font-weight: 800; font-size: 14px;
  margin-bottom: 8px;
}
.guide .q h3 { font-size: 16px; font-weight: 800; margin-bottom: 5px; }
.guide .q p { font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
.stars { text-align: center; font-size: 34px; letter-spacing: 4px; color: var(--signature, #C9A84C); margin: 18px 0 4px; }
.review-cta {
  display: block; width: 100%; text-align: center; text-decoration: none;
  background: #C9A84C; color: #16222E; font-weight: 800; font-size: 17px;
  padding: 16px; border-radius: 12px; margin-top: 6px;
}
.review-cta:active { background: #b8983f; }
.doc-btns { display: flex; gap: 8px; margin-top: 4px; }
.doc-btns .btn { margin-top: 0; }
.doc-sheet {
  background: #fff;
  color: #16222E;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px 24px;
}
.doc-sheet .doc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.doc-sheet .biz-name { font-size: 21px; font-weight: 800; }
.doc-sheet .biz-meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; line-height: 1.5; }
.doc-sheet .doc-kind {
  font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--blueprint); text-align: right;
}
.doc-sheet .doc-num { font-size: 13px; color: var(--ink-soft); text-align: right; margin-top: 3px; }
.doc-sheet .doc-parties { display: flex; justify-content: space-between; margin-top: 22px; font-size: 14px; gap: 16px; }
.doc-sheet .doc-parties .label { font-weight: 700; color: var(--ink-soft); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 3px; }
.doc-sheet table.doc-lines { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 15px; }
.doc-sheet table.doc-lines th {
  text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--ink-soft); border-bottom: 2px solid var(--ink); padding: 0 0 8px;
}
.doc-sheet table.doc-lines th.r, .doc-sheet table.doc-lines td.r { text-align: right; }
.doc-sheet table.doc-lines td { padding: 10px 0; border-bottom: 1px solid var(--floor); }
.doc-sheet .doc-total { display: flex; justify-content: space-between; margin-top: 16px; font-size: 20px; font-weight: 800; }
.doc-sheet .doc-foot { margin-top: 22px; font-size: 13px; color: var(--ink-soft); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 14px; }
.doc-paid {
  display: inline-block; margin-top: 12px; border: 2px solid var(--healthy); color: var(--healthy);
  font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: 14px;
  padding: 5px 14px; border-radius: 6px; transform: rotate(-4deg);
}
@media print {
  body { background: #fff; padding: 0; }
  header, .no-print { display: none !important; }
  main { max-width: none; padding: 0; }
  .doc-sheet { border: none; border-radius: 0; padding: 0; }
}

@media (prefers-reduced-motion: no-preference) {
  .card, .ticket { animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>

<body>

<header>
  <div class="wordmark">True<span>Rate</span></div>
  <div class="tagline">Know what your work really costs. Price from there.</div>
</header>

<main>
  <section id="view-rate" hidden></section>
  <section id="view-job"></section>
  <section id="view-fivestar" hidden></section>
</main>

<nav class="bottomnav no-print" id="bottomnav">
  <button id="nav-job" class="active" onclick="goJob()">
    <span class="ic">&#128181;</span><span>Price a Job</span>
  </button>
  <button id="nav-fivestar" onclick="goFiveStar()">
    <span class="ic">&#9733;</span><span>Five Star</span>
  </button>
</nav>

<script>
/* ************************************************************
 * ************************************************************
 *
 *   PRICING MATH
 *   All money is stored and computed as INTEGER CENTS.
 *   No floats touch currency values. Percentages are handled
 *   as basis points (1% = 100 bp) so division happens once,
 *   at the final rounding step.
 *
 *   Margin and markup are different concepts:
 *     margin = profit / price
 *     markup = profit / cost
 *   A 50% margin equals a 100% markup. The two are never
 *   mixed anywhere in this section.
 *
 * ************************************************************
 * ************************************************************/

// A residential service job below this share-kept gets a warning.
const MARGIN_WARNING_THRESHOLD_BP = 4500;   // 45.00% in basis points
const MAX_TARGET_MARGIN_BP        = 7500;   // 75% cap so the math stays sane
const DEFAULT_PAYROLL_TAX_BP      = 765;    // 7.65% employer FICA
const DEFAULT_TARGET_MARGIN_BP    = 5500;   // recommended when the owner has no number

// ---- conversions ----

function dollarsToCents(str) {
  const clean = String(str).replace(/[$,\s]/g, "");
  if (clean === "" || !/^\d*\.?\d*$/.test(clean) || clean === ".") return NaN;
  const parts = clean.split(".");
  const whole = parseInt(parts[0] || "0", 10);
  const fracStr = ((parts[1] || "") + "00").slice(0, 2);
  return whole * 100 + parseInt(fracStr, 10);
}

function fmtCents(cents) {
  const sign = cents < 0 ? "-" : "";
  const abs = Math.abs(cents);
  const dollars = Math.floor(abs / 100);
  const rem = String(abs % 100).padStart(2, "0");
  return sign + "$" + dollars.toLocaleString("en-US") + "." + rem;
}

function percentToBp(str) {
  const clean = String(str).replace(/[%\s]/g, "");
  if (clean === "" || !/^\d*\.?\d*$/.test(clean) || clean === ".") return NaN;
  return Math.round(parseFloat(clean) * 100);
}

// Basis points shown to the user as "cents of every dollar"
function fmtBpCents(bp) {
  return Math.round(bp / 100) + " cents";
}
function fmtBp(bp) {
  return (bp / 100).toLocaleString("en-US", { maximumFractionDigits: 1 }) + "%";
}

// ---- core calculations (all cents in, cents out) ----

function payrollTaxCents(wagesCents, taxBp) {
  return Math.round(wagesCents * taxBp / 10000);
}

// Owner pay is deliberately INCLUDED as an annual cost. Most
// trades owners treat their pay as the leftovers; TrueRate's
// position is that the owner's pay is a cost every job must
// carry, or the rate is built on a fiction.
function totalLoadedCostCents(c) {
  return c.wages
    + payrollTaxCents(c.wages, c.payrollTaxBp)
    + c.workersComp
    + c.liability
    + c.vehicle
    + c.tools
    + c.overhead;
}

function loadedHourlyRateCents(totalAnnualCents, billableHours) {
  return Math.round(totalAnnualCents / billableHours);
}

// price = cost / (1 - margin)
function minBillableRateCents(loadedRateCents, targetMarginBp) {
  return Math.round(loadedRateCents * 10000 / (10000 - targetMarginBp));
}

function jobCostCents(materialsCents, laborHours, loadedRateCents) {
  return materialsCents + Math.round(laborHours * loadedRateCents);
}
function jobPriceCents(materialsCents, laborHours, loadedRateCents, targetMarginBp) {
  const cost = jobCostCents(materialsCents, laborHours, loadedRateCents);
  return Math.round(cost * 10000 / (10000 - targetMarginBp));
}

function grossMarginBp(priceCents, costCents) {
  if (priceCents <= 0) return NaN;
  return Math.round((priceCents - costCents) * 10000 / priceCents);
}

// markup = margin / (1 - margin)
function marginToMarkupBp(marginBp) {
  return Math.round(marginBp * 10000 / (10000 - marginBp));
}

// Markup of an actual price over an actual cost, in basis points.
// markup = (price - cost) / cost
function markupBpFromCost(priceCents, costCents) {
  if (costCents <= 0) return NaN;
  return Math.round((priceCents - costCents) * 10000 / costCents);
}

// What a given markup actually leaves you as margin (what you keep), in bp.
// margin = markup / (1 + markup)
function markupToMarginBp(markupBp) {
  return Math.round(markupBp * 10000 / (10000 + markupBp));
}

/* ************************************************************
 *   END PRICING MATH
 * ************************************************************/


/* ************************************************************
 *   AI ADVISOR INTEGRATION POINT (STUB)
 *
 *   The TrueRate advisor attaches here in a later version.
 *   It will receive structured pricing events and return
 *   plain-language guidance in the TrueRate voice (see the
 *   TrueRate system prompt, v1.0).
 *
 *   Contract:
 *     TrueRateAdvisor.onEvent(event) -> Promise<string|null>
 *     event = {
 *       type: "rate_calculated" | "job_priced" | "margin_warning"
 *             | "price_overridden",
 *       data: { ...all relevant cents/bp values }
 *     }
 *
 *   Nothing in this MVP depends on the advisor. All calls are
 *   fire-and-forget and tolerate a null response.
 * ************************************************************/
const TrueRateAdvisor = {
  enabled: false, // flip when the advisor service is wired up
  async onEvent(event) {
    if (!this.enabled) return null;
    // TODO: send event to the advisor endpoint and return its message.
    return null;
  }
};
/* ********************* END ADVISOR STUB ********************/


/* ============================================================
   STATE + STORAGE
   ============================================================ */
const memStore = {};
function saveState(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); }
  catch (e) { memStore[key] = JSON.stringify(obj); }
}
function loadState(key) {
  try {
    const raw = localStorage.getItem(key) ?? memStore[key];
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return memStore[key] ? JSON.parse(memStore[key]) : null;
  }
}

let rateInputs = loadState("truerate.inputs") || null;
let rateResult = loadState("truerate.result") || null;
let bizInfo = loadState("truerate.biz") || null; // { name, phone, license }
let leadCaptured = loadState("truerate.lead") || null; // { firstName, lastName, email }

// Lead delivery. For now leads come to you by email. Later, point
// LEAD_ENDPOINT at a backend (e.g. a Cloudflare Worker calling the GHL
// API) and submitLead will POST there first, falling back to email.
// Leads post straight to your GHL inbound webhook. Email is a silent
// fallback only if the post fails (e.g. no signal on a job site).
const LEAD_ENDPOINT = "https://services.leadconnectorhq.com/hooks/jcpu3uIoEG7kKgprJYwU/webhook-trigger/cce38536-6fbb-4601-8969-b82155fcc620";
const LEAD_EMAIL = "truerateapp@kbtraininggroup.com";
// The price currently shown on the result screen (so document tools print the right one).
let shownPriceCents = null;

function submitLead() {

  const lastName = document.getElementById("lead-last").value.trim();
  const email = document.getElementById("lead-email").value.trim();
  const errEl = document.getElementById("lead-error");

  if (!lastName) { errEl.textContent = "Add your last name."; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = "Add a valid email address so we can send your access."; return; }
  errEl.textContent = "";
  const lead = { firstName, lastName, email, at: new Date().toISOString() };
  leadCaptured = lead;

  deliverLead(lead);
  showChrome(true);
  goJob();

// The exact shape sent to GHL. These are the field names you map in the
// workflow: firstName, lastName, email, source, signedUpAt.
function leadPayload(lead) {
  return {
    firstName: lead.firstName,
    lastName: lead.lastName,
    email: lead.email,
    source: "TrueRate App",
    signedUpAt: lead.at
  };
}

// Posts the lead to the GHL webhook. If that fails, falls back to email
// so a lead is never silently lost.
function deliverLead(lead) {
  if (LEAD_ENDPOINT) {
    try {
      fetch(LEAD_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(leadPayload(lead))
      }).catch(() => emailLead(lead));
      return;
    } catch (e) { emailLead(lead); return; }
  }
  emailLead(lead);
}

function emailLead(lead) {
  const subject = encodeURIComponent("New TrueRate lead: " + lead.firstName + " " + lead.lastName);
  const body = encodeURIComponent(
    "New TrueRate signup\n\n" +
    "First name: " + lead.firstName + "\n" +
    "Last name: " + lead.lastName + "\n" +
    "Email: " + lead.email + "\n" +
    "Signed up: " + lead.at + "\n"
  );
  // Opens the device mail app addressed to you. The person taps send.
  window.location.href = "mailto:" + LEAD_EMAIL + "?subject=" + subject + "&body=" + body;
}

function validateStep(step, raw) {
  if (step.kind === "money") {
    const cents = dollarsToCents(raw);
    if (isNaN(cents)) return { err: "Enter a dollar amount, numbers only. Zero is fine if this one does not apply to you." };
    return { value: cents };
  }
  if (step.kind === "percent" || step.kind === "margin" || step.kind === "payroll") {
    const bp = percentToBp(raw);
    if (isNaN(bp)) return { err: "Enter a number, like 7.65 or 55." };
    if (step.kind === "margin") {
      if (bp <= 0) return { err: "The share you keep needs to be above zero, or every job just breaks even." };
      if (bp > MAX_TARGET_MARGIN_BP) return { err: "Keep it at 75 or below. Above that, the math stops matching real service work." };
    }
    if (step.key === "payrollTaxBp" && bp > 2500) return { err: "That looks too high for payroll tax. Most owners are near 7.65. Double check it." };
    return { value: bp };
  }
  const clean = String(raw).replace(/[,\s]/g, "");
  const n = parseFloat(clean);
  if (!/^\d*\.?\d*$/.test(clean) || isNaN(n)) return { err: "Enter your hours as a number, like 1200." };
  if (n <= 0) return { err: "Hours need to be above zero. Not sure? 1,200 is a fair starting point for one truck." };
  if (n > 3000) return { err: "There are not that many billable hours in a year for one truck. Check the number." };
  return { value: n };
}

function nextStep() {
  const step = STEPS[wizardStep];
  const raw = document.getElementById("step-input").value;
  const res = validateStep(step, raw === "" && step.defaultValue ? step.defaultValue : raw);
  if (res.err) { document.getElementById("step-error").textContent = res.err; return; }
  wizardDraft[step.key] = res.value;
  if (wizardStep < STEPS.length - 1) { wizardStep++; renderWizardStep(); }
  else finishWizard();
}
function prevStep() { wizardStep--; renderWizardStep(); }
function cancelWizard() { wizardActive = false; pendingJob = null; goJob(); }

function finishWizard() {
  rateInputs = { ...wizardDraft };
  const totalCents = totalLoadedCostCents(rateInputs);
  const loadedRateCents = loadedHourlyRateCents(totalCents, rateInputs.billableHours);
  const minRateCents = minBillableRateCents(loadedRateCents, rateInputs.targetMarginBp);
  rateResult = { totalCents, loadedRateCents, minRateCents };
  saveState("truerate.inputs", rateInputs);
  saveState("truerate.result", rateResult);
  wizardActive = false;
  TrueRateAdvisor.onEvent({ type: "rate_calculated", data: { ...rateInputs, ...rateResult } });
  // If the rate setup was triggered by a job they were trying to price,
  // drop them back into that job and run it now.
  if (pendingJob) {
    const p = pendingJob;
    pendingJob = null;
    jobMode = p.mode;
    goJob();
    runJobPrice(p.type, p.hours, p.materialsCents, p.theirPriceCents, p.mode);
    return;
  }
  goRate();
}

function renderJobTab() {
  // First visit, before any rate is set: orient them. One screen, once.
  if (!hasSeenWelcome && !rateResult) {
    renderWelcome();
    return;
  }
  const j = lastJob;
  const seg = `
    <div class="seg">
      <button class="${jobMode === "flat" ? "active" : ""}" onclick="setJobMode('flat')">I charge a flat price</button>
      <button class="${jobMode === "check" ? "active" : ""}" onclick="setJobMode('check')">I have a price in mind</button>
      <button class="${jobMode === "build" ? "active" : ""}" onclick="setJobMode('build')">Help me figure it out</button>
    </div>`;

  let body;
  if (jobMode === "flat") {
    body = `
      <h2>Your flat rate for this job</h2>
      <p class="lead-note">A lot of owners price by the job, not the hour. A water heater is a water heater. Put in what you charge for it and I will work backward to show you what that price is really earning you.</p>
      ${rateStatusHtml()}
      <div class="field" style="margin-top:4px">
        <label for="check-price">Your set price for this kind of job</label>
        <div class="input-wrap" style="margin:0">
          <span class="prefix">$</span>
          <input id="check-price" class="big has-prefix" type="text" inputmode="decimal" placeholder="450">
        </div>
      </div>
      <p class="lead-note">Two quick things so I can check it:</p>
      ${jobInputsHtml(j)}
      <div class="field-error" id="job-error"></div>
      <button class="btn btn-primary" onclick="priceJob('flat')">Show me what it really earns</button>`;
  } else if (jobMode === "check") {
    body = `
      <h2>Check a price you have in mind</h2>
      <p class="lead-note">Got a number for this one job already? Put it in and I will tell you straight if it is a good call.</p>
      ${rateStatusHtml()}
      <div class="field" style="margin-top:4px">
        <label for="check-price">What are you thinking of charging?</label>
        <div class="input-wrap" style="margin:0">
          <span class="prefix">$</span>
          <input id="check-price" class="big has-prefix" type="text" inputmode="decimal" placeholder="450">
        </div>
      </div>
      ${jobInputsHtml(j)}
      <div class="field-error" id="job-error"></div>
      <button class="btn btn-primary" onclick="priceJob('check')">Tell me if it is a good call</button>`;
  } else {
    body = `
      <h2>Let's figure out the price together</h2>
      <p class="lead-note">Not sure what to charge? Tell me the job and I will hand you the price that protects what you keep.</p>
      ${rateStatusHtml()}
      ${jobInputsHtml(j)}
      <div class="field-error" id="job-error"></div>
      <button class="btn btn-primary" onclick="priceJob('build')">Build my price</button>`;
  }

  viewJob.innerHTML = `<div class="card">${seg}${body}</div><div id="job-result"></div>`;
}

// First-run welcome. Frames the whole tool in one sentence, then turns the
// three modes into a plain-language "which of these is you" choice.
function renderWelcome() {
  viewJob.innerHTML = `
    <div class="card">
      <h1>Is your price actually making you money?</h1>
      <p class="welcome-lead">TrueRate takes any job price and tells you straight whether it covers your costs and pays you, or quietly loses you money.</p>
      <p class="welcome-lead" style="margin-top:10px;margin-bottom:16px">To start, pick the one that sounds like you:</p>

      <button class="choice lead-choice" onclick="chooseMode('flat')">
        <span class="badge">Most owners</span>
        <span class="c-title">I charge a flat price for a job</span>
        <div class="c-sub">Like "a water heater is $450." You price by the job, not the hour. I will show you what that price really earns you.</div>
      </button>

      <button class="choice" onclick="chooseMode('check')">
        <span class="c-title">I have a price in mind</span>
        <div class="c-sub">You are looking at one job and have a number already. I will tell you if it is a good call.</div>
      </button>

      <button class="choice" onclick="chooseMode('build')">
        <span class="c-title">I am not sure what to charge</span>
        <div class="c-sub">Tell me the job and I will build you a price from the ground up.</div>
      </button>

      <p class="note" style="margin-top:18px">Quick heads up: the first time, I will ask nine short questions about what your business costs to run. Three minutes, one time. After that, every price check is instant.</p>
    </div>`;
}

function chooseMode(mode) {
  hasSeenWelcome = true;
  saveState("truerate.seenWelcome", true);
  jobMode = mode;
  renderJobTab();
  window.scrollTo(0, 0);
}

// Reads and validates the form. Returns parsed values or null (after showing an error).
function readJobForm(mode) {
  const errEl = document.getElementById("job-error");
  const type = document.getElementById("job-type").value;
  const hoursRaw = document.getElementById("job-hours").value.replace(/[,\s]/g, "");
  const hours = parseFloat(hoursRaw);
  const materialsCents = dollarsToCents(document.getElementById("job-materials").value || "0");
  if (!/^\d*\.?\d*$/.test(hoursRaw) || isNaN(hours) || hours <= 0) {
    errEl.textContent = "Enter the hours as a number above zero, like 3 or 3.5."; return null;
  }
  if (isNaN(materialsCents)) {
    errEl.textContent = "Enter the parts cost in dollars, numbers only. Zero is fine."; return null;
  }
  const reverse = (mode === "check" || mode === "flat");
  let theirPriceCents = null;
  if (reverse) {
    theirPriceCents = dollarsToCents(document.getElementById("check-price").value);
    if (isNaN(theirPriceCents) || theirPriceCents <= 0) {
      errEl.textContent = mode === "flat"
        ? "Enter your flat price for this job, in dollars."
        : "Enter the price you had in mind, in dollars.";
      return null;
    }
  }
  errEl.textContent = "";
  return { type, hours, materialsCents, theirPriceCents, mode };
}

// Entry point from every mode's button.
function priceJob(mode) {
  const form = readJobForm(mode);
  if (!form) return;
  // The one-time gate: if we do not know their cost yet, run the rate
  // setup now, holding their job inputs, then come right back and finish.
  if (!rateResult) {
    pendingJob = form;
    startWizard();
    return;
  }
  runJobPrice(form.type, form.hours, form.materialsCents, form.theirPriceCents, form.mode);
}

// Does the math and renders. Safe to call only once rateResult exists.
function runJobPrice(type, hours, materialsCents, theirPriceCents, mode) {
  const reverse = (mode === "check" || mode === "flat");
  const marginBp = rateInputs.targetMarginBp;
  const costCents = jobCostCents(materialsCents, hours, rateResult.loadedRateCents);
  const priceCents = jobPriceCents(materialsCents, hours, rateResult.loadedRateCents, marginBp);
  lastJob = { type, hours, materialsCents, costCents, priceCents };
  TrueRateAdvisor.onEvent({ type: "job_priced", data: { ...lastJob, marginBp, mode } });
  renderJobResult(reverse ? theirPriceCents : priceCents, mode);
  const res = document.getElementById("job-result");
  if (res) res.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderJobResult(currentPriceCents, mode) {
  const j = lastJob;
  shownPriceCents = currentPriceCents;
  const reverse = mode === "check" || mode === "flat";
  const isFlat = mode === "flat";
  const laborCents = Math.round(j.hours * rateResult.loadedRateCents);
  const actualMarginBp = grossMarginBp(currentPriceCents, j.costCents);
  const profitCents = currentPriceCents - j.costCents;
  const below = actualMarginBp < MARGIN_WARNING_THRESHOLD_BP;

  let statusHtml;
  if (profitCents <= 0) {
    statusHtml = `
      <div class="status warn">
        <strong>This price pays everyone but you</strong>
        The job costs you ${fmtCents(j.costCents)} to deliver, counting your pay, the truck, and parts. At this price ${profitCents < 0 ? "you lose " + fmtCents(-profitCents) + " doing the work" : "you break exactly even, which means the business earns nothing for taking the risk"}. The price that protects you is ${fmtCents(j.priceCents)}.
      </div>`;
    TrueRateAdvisor.onEvent({ type: "margin_warning", data: { ...j, currentPriceCents, actualMarginBp } });
  } else if (below) {
    const fixPriceCents = jobPriceCents(j.materialsCents, j.hours, rateResult.loadedRateCents, MARGIN_WARNING_THRESHOLD_BP);
    statusHtml = `
      <div class="status warn">
        <strong>Not a strong business decision at this number</strong>
        You keep ${fmtBpCents(actualMarginBp)} of every dollar after labor and parts. That feels fine until the truck needs tires or a slow month shows up. For service work you want to keep at least 45 cents of every dollar, which puts this job at ${fmtCents(fixPriceCents)} or better. The price that hits your full target is ${fmtCents(j.priceCents)}. Plenty of owners price low to keep the phone ringing. Now you can see what it actually costs you.
      </div>`;
    TrueRateAdvisor.onEvent({ type: "margin_warning", data: { ...j, currentPriceCents, actualMarginBp } });
  } else {
    statusHtml = `
      <div class="status good">
        <strong>${reverse ? (isFlat ? "Your flat rate is earning its keep" : "Your number is a solid business decision") : "This price holds up"}</strong>
        You keep ${fmtBpCents(actualMarginBp)} of every dollar on this job after labor and parts. That share pays for slow weeks, truck repairs, and your future. ${reverse && currentPriceCents < j.priceCents ? "Worth knowing: the price that hits your full target is " + fmtCents(j.priceCents) + ", so there is room above you if you want it." : "This price has a foundation under it."}
      </div>`;
  }

  const quote = buildCustomerQuote(j, currentPriceCents);

  // Markup vs what you keep. Answers the common "should I stop using
  // my markup calculator" question by showing the two are not the same.
  const thisMarkupBp = markupBpFromCost(currentPriceCents, j.costCents);
  const commonMarkups = [2000, 3000, 5000, 10000]; // 20, 30, 50, 100 percent
  const markupRows = commonMarkups.map(mk =>
    `<tr><td>Mark up ${fmtBp(mk)} over cost</td><td>keeps you ${fmtBpCents(markupToMarginBp(mk))} of every dollar</td></tr>`
  ).join("");
  const markupCompareHtml = profitCents <= 0 ? "" : `
    <details class="compare">
      <summary>Wait, what about marking up? &#9662;</summary>
      <div class="compare-body">
        <p class="help">If you have been pricing with a markup calculator, you do not have to stop. You just want to know what your markup is really leaving you. They are two different numbers.</p>
        <p class="help" style="margin-top:8px"><strong>This job:</strong> your price is a ${fmtBp(thisMarkupBp)} markup over what it costs you, and that keeps you ${fmtBpCents(actualMarginBp)} of every dollar.</p>
        <p class="help" style="margin-top:8px">Here is the trap. A markup always keeps you less than the markup number:</p>
        <table class="breakdown" style="margin-top:8px">${markupRows}</table>
        <p class="help" style="margin-top:8px">So marking up 30 percent sounds healthy, but it only keeps you 23 cents on the dollar. TrueRate sets what you keep first, so you are never guessing which side of that gap you landed on.</p>
      </div>
    </details>`;

  document.getElementById("job-result").innerHTML = `
    <div class="ticket">
      <div class="ticket-head"><span>${esc(j.type)}</span><span class="stamp">${reverse ? (isFlat ? "Flat rate check" : "Price check") : "Your price"}</span></div>
      <div class="ticket-body">
        <div class="rate-line">
          <div class="rate-label">${reverse ? (isFlat ? "Your flat rate" : "The price you had in mind") : "Charge this"}</div>
          <div class="rate-value">${fmtCents(currentPriceCents)}</div>
        </div>
        <div class="ticket-perf"></div>
        <table class="breakdown">
          <tr><td>Labor (${j.hours} hrs at your real cost)</td><td>${fmtCents(laborCents)}</td></tr>
          <tr><td>Parts</td><td>${fmtCents(j.materialsCents)}</td></tr>
          <tr><td>What this job costs you</td><td>${fmtCents(j.costCents)}</td></tr>
          <tr class="total"><td>What you keep</td><td>${fmtCents(profitCents)}</td></tr>
          <tr class="total"><td>Out of every dollar, you keep</td><td>${profitCents <= 0 ? "nothing" : fmtBpCents(actualMarginBp)}</td></tr>
        </table>
        ${statusHtml}
        ${markupCompareHtml}
        ${reverse ? `<div class="btn-row"><button class="btn btn-primary" onclick="useTargetPrice()">Show me the price that protects me</button></div>` : ""}
        <div class="field" style="margin-top:18px">
          <label for="override-price">Want to try another number? Type it in and check it the same way.</label>
          <div class="input-wrap" style="margin:0">
            <span class="prefix">$</span>
            <input id="override-price" class="big has-prefix" type="text" inputmode="decimal" placeholder="${(currentPriceCents / 100).toFixed(2)}">
          </div>
          <button class="btn btn-ghost" onclick="overridePrice()">Run the numbers on it</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Words for your customer</h2>
      <p class="help">Lead with what they get and what they avoid. The price comes last, after the value is clear. Parts stay named plainly, because honest language is what keeps customers calling you back.</p>
      <div class="quote-box">${esc(quote)}</div>
    </div>
    <div class="card">
      <h2>Turn this into a document</h2>
      <p class="help">Make it official and hand it to your customer on the spot. Print it, save a PDF, or email it.</p>
      <div class="doc-btns">
        <button class="btn btn-ghost" onclick="startDoc('estimate')">Estimate</button>
        <button class="btn btn-ghost" onclick="startDoc('invoice')">Invoice</button>
        <button class="btn btn-ghost" onclick="startDoc('receipt')">Receipt</button>
      </div>
    </div>`;
}

function useTargetPrice() {
  renderJobResult(lastJob.priceCents, "build");
  document.getElementById("job-result").scrollIntoView({ behavior: "smooth", block: "start" });
}

// Customer-facing language: value first, loss framing second,
// price last. Parts stay named plainly, never renamed.
function buildCustomerQuote(j, priceCents) {
  return j.type + " for your home\n\n"
    + "What you get:\n"
    + "- The problem fixed right the first time, by a pro who does this every day\n"
    + "- Quality parts, named plainly on your invoice so you know exactly what went in\n"
    + "- Our workmanship guarantee, so if it is not right, we make it right\n\n"
    + "What you avoid:\n"
    + "- The repeat visits and bigger repair bills that come with a patch job\n"
    + "- Surprise charges. The price below is the full price.\n\n"
    + "Your total: " + fmtCents(priceCents);
}

function overridePrice() {
  const cents = dollarsToCents(document.getElementById("override-price").value);
  if (isNaN(cents) || cents <= 0) return;
  TrueRateAdvisor.onEvent({ type: "price_overridden", data: { ...lastJob, overrideCents: cents } });
  renderJobResult(cents, "check");
  document.getElementById("job-result").scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ************************************************************
 *   DOCUMENTS: estimate / invoice / receipt
 *   Generates a printable document the owner can hand to a
 *   customer on the spot (print, save as PDF, or email).
 * ************************************************************/

const DOC_LABELS = { estimate: "Estimate", invoice: "Invoice", receipt: "Receipt" };
let docDraft = null; // { kind }

function startDoc(kind) {
  docDraft = { kind };
  if (!bizInfo) { renderBizSetup(); return; }
  renderCustomerForm();
}

function renderBizSetup() {
  viewJob.innerHTML = `
    <div class="card">
      <h2>First, your business info</h2>
      <p class="help">This goes at the top of every document you send. You only set it once.</p>
      <div class="field" style="margin-top:14px">
        <label for="biz-name">Business name</label>
        <input id="biz-name" class="big" type="text" autocomplete="organization" placeholder="Your business" value="${bizInfo ? esc(bizInfo.name) : ""}" style="font-size:20px">
      </div>
      <div class="field">
        <label for="biz-phone">Phone</label>
        <input id="biz-phone" class="big" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 123 4567" value="${bizInfo ? esc(bizInfo.phone) : ""}" style="font-size:20px">
      </div>
      <div class="field">
        <label for="biz-license">License number (optional)</label>
        <input id="biz-license" class="big" type="text" placeholder="Leave blank if none" value="${bizInfo ? esc(bizInfo.license) : ""}" style="font-size:20px">
      </div>
      <div class="field-error" id="biz-error"></div>
      <button class="btn btn-primary" onclick="saveBiz()">Save and continue</button>
      <button class="btn btn-ghost" onclick="goJob()">Cancel</button>
    </div>`;
  viewRate.hidden = true; viewFiveStar.hidden = true; viewJob.hidden = false; setNav("job");
  window.scrollTo(0, 0);
}

function saveBiz() {
  const name = document.getElementById("biz-name").value.trim();
  const phone = document.getElementById("biz-phone").value.trim();
  const license = document.getElementById("biz-license").value.trim();
  if (!name) { document.getElementById("biz-error").textContent = "Add your business name so the document has a heading."; return; }
  bizInfo = { name, phone, license };
  saveState("truerate.biz", bizInfo);
  renderCustomerForm();
}

function renderCustomerForm() {
  const kind = docDraft.kind;
  const today = new Date();
  const dateStr = today.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  viewJob.innerHTML = `
    <div class="card">
      <h2>New ${esc(DOC_LABELS[kind].toLowerCase())}</h2>
      <p class="help">One quick thing and your ${esc(DOC_LABELS[kind].toLowerCase())} is ready.</p>
      <div class="field" style="margin-top:14px">
        <label for="cust-name">Customer name</label>
        <input id="cust-name" class="big" type="text" placeholder="Customer name" style="font-size:20px">
      </div>
      <div class="field">
        <label for="cust-addr">Customer address or phone (optional)</label>
        <input id="cust-addr" class="big" type="text" placeholder="Leave blank if you want" style="font-size:20px">
      </div>
      <div class="field">
        <label for="doc-date">Date</label>
        <input id="doc-date" class="big" type="text" value="${esc(dateStr)}" style="font-size:20px">
      </div>
      <div class="field-error" id="cust-error"></div>
      <button class="btn btn-primary" onclick="makeDoc()">Create ${esc(DOC_LABELS[kind].toLowerCase())}</button>
      <button class="btn btn-ghost" onclick="goJob()">Cancel</button>
      <p class="note">Want to fix your business name or phone? <a href="#" onclick="renderBizSetup();return false;" style="color:var(--blueprint);font-weight:700;text-decoration:none">Edit business info</a></p>
    </div>`;
  viewRate.hidden = true; viewFiveStar.hidden = true; viewJob.hidden = false; setNav("job");
  window.scrollTo(0, 0);
}

function docNumber(kind) {
  const d = new Date();
  const stamp = "" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0")
    + "-" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0");
  return DOC_LABELS[kind].slice(0, 3).toUpperCase() + "-" + stamp;
}

function makeDoc() {
  const name = document.getElementById("cust-name").value.trim();
  if (!name) { document.getElementById("cust-error").textContent = "Add the customer name for the document."; return; }
  const addr = document.getElementById("cust-addr").value.trim();
  const dateStr = document.getElementById("doc-date").value.trim();
  const kind = docDraft.kind;
  const j = lastJob;
  const num = docNumber(kind);
  const laborCents = Math.round(j.hours * rateResult.loadedRateCents);
  const total = shownPriceCents;

  // A document shows one honest line for the job and one for parts.
  // It never renames standard parts and never exposes the owner's internal cost math.
  const partsCents = j.materialsCents;
  const serviceCents = total - partsCents; // the customer-facing service line
  const intro = kind === "estimate"
    ? "Estimate for the work described below. Good for 30 days."
    : kind === "invoice"
    ? "Invoice for work completed. Thank you for your business."
    : "Receipt. Paid in full. Thank you for your business.";

  const data = { kind, num, name, addr, dateStr, total, serviceCents, partsCents, job: j.type };
  TrueRateAdvisor.onEvent({ type: "document_created", data });
  renderDoc(data, intro);
}

function renderDoc(d, intro) {
  const b = bizInfo;
  const bizMeta = [b.phone, b.license ? "License " + b.license : ""].filter(Boolean).map(esc).join("<br>");
  const paidStamp = d.kind === "receipt" ? `<div class="doc-paid">Paid in full</div>` : "";
  viewJob.innerHTML = `
    <div class="card no-print" id="doc-actions">
      <h2>${esc(DOC_LABELS[d.kind])} ready</h2>
      <p class="help">Print it, save it as a PDF, or email it to your customer.</p>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="window.print()">Print or save as PDF</button>
        <button class="btn btn-ghost" onclick="emailDoc()">Email to customer</button>
        <button class="btn btn-ghost" onclick="sendToCrm()">Send to my CRM</button>
        <button class="btn btn-ghost" onclick="goJob()">Done</button>
      </div>
    </div>
    <div class="doc-sheet" id="doc-sheet">
      <div class="doc-top">
        <div>
          <div class="biz-name">${esc(b.name)}</div>
          <div class="biz-meta">${bizMeta}</div>
        </div>
        <div>
          <div class="doc-kind">${esc(DOC_LABELS[d.kind])}</div>
          <div class="doc-num">${esc(d.num)}</div>
          <div class="doc-num">${esc(d.dateStr)}</div>
        </div>
      </div>
      <div class="doc-parties">
        <div>
          <div class="label">Billed to</div>
          <div>${esc(d.name)}</div>
          ${d.addr ? `<div>${esc(d.addr)}</div>` : ""}
        </div>
      </div>
      <table class="doc-lines">
        <thead><tr><th>Description</th><th class="r">Amount</th></tr></thead>
        <tbody>
          <tr><td>${esc(d.job)} (labor)</td><td class="r">${fmtCents(d.serviceCents)}</td></tr>
          ${d.partsCents > 0 ? `<tr><td>Parts and materials</td><td class="r">${fmtCents(d.partsCents)}</td></tr>` : ""}
        </tbody>
      </table>
      <div class="doc-total"><span>${d.kind === "estimate" ? "Estimated total" : "Total"}</span><span>${fmtCents(d.total)}</span></div>
      ${paidStamp}
      <div class="doc-foot">${esc(intro)}</div>
    </div>`;
  viewRate.hidden = true; viewFiveStar.hidden = true; viewJob.hidden = false; setNav("job");
  window.scrollTo(0, 0);
}

function emailDoc() {
  const sheet = document.getElementById("doc-sheet");
  const d = docDraft;
  const subject = encodeURIComponent(`${DOC_LABELS[d.kind]} from ${bizInfo.name}`);
  const body = encodeURIComponent(sheet.innerText.replace(/\n{3,}/g, "\n\n"));
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

/* ************************************************************
 *   GHL CRM INTEGRATION POINT (STUB)
 *   This is where TrueRate will push the document to the
 *   owner's GoHighLevel CRM in a later version. Wire the
 *   endpoint and auth here. For now it confirms locally.
 * ************************************************************/
const TrueRateCrm = {
  enabled: false, // flip when the GHL endpoint is wired up
  async send(doc) {
    if (!this.enabled) return { ok: false, reason: "not_connected" };
    // TODO: POST the document to the GHL CRM endpoint with auth.
    return { ok: false, reason: "not_implemented" };
  }
};

function sendToCrm() {
  const box = document.getElementById("doc-actions");
  const msg = document.createElement("p");
  msg.className = "note";
  msg.style.marginTop = "12px";
  msg.textContent = "CRM sending is coming soon. This will drop the document straight into your CRM. For now, print it or email it to your customer.";
  box.appendChild(msg);
}
/* ********************* END CRM STUB ********************/

/* ---------- boot ---------- */
goJob();
</script>
</body>
</html>
